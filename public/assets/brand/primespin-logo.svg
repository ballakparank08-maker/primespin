<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="gold-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1be" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#fed668" />
    </linearGradient>
    <linearGradient id="gold-shield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2010" />
      <stop offset="100%" stop-color="#0e0c08" />
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed668" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#fff5c0" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(4, 2)">
    <polygon points="21,3 37,12 37,33 21,42 5,33 5,12" fill="url(#gold-shield)" stroke="url(#gold-stroke)" stroke-width="1.8" filter="url(#gold-glow)"/>
    <polygon points="21,7 33,14 33,31 21,38 9,31 9,14" fill="none" stroke="url(#gold-brand)" stroke-width="0.8" opacity="0.6"/>
    <!-- Crown Geometry -->
    <path d="M12,28 L14,18 L18,22 L21,15 L24,22 L28,18 L30,28 Z" fill="url(#gold-brand)"/>
    <!-- Center Diamond -->
    <polygon points="21,21 23.5,25 21,29 18.5,25" fill="#ffffff" opacity="0.95"/>
    <!-- Base Ribbon Line -->
    <rect x="12" y="29.5" width="18" height="2" rx="1" fill="url(#gold-brand)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(52, 4)">
    <text x="0" y="25" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="url(#gold-brand)">
      Prime<tspan fill="#ffffff" font-weight="800">SPIN</tspan>
    </text>
    <text x="1" y="38" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="3" fill="#d4af37" opacity="0.95">
      VIP MALAYSIA
    </text>
  </g>
</svg>
